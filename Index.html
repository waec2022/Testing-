<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>StudyDesk — interactive preview</title><meta name="theme-color" content="#070B20"><style>:root {
  --bg: #070B20; --bg2: #0B1030; --card: #111735; --card2: #151D43; --border: #252B58;
  --purple: #A855F7; --deep: #6D28D9; --blue: #2563EB; --cyan: #06B6D4; --green: #10B981;
  --orange: #F59E0B; --gold: #FACC15; --text: #F4F3FF; --muted: #A5ADD0;
  --sidebar-w: 280px; --header-h: 68px; --radius: 16px;
  --font: Inter, "Segoe UI", Roboto, system-ui, -apple-system, sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--font); line-height: 1.5; overflow-x: hidden; }
a { color: inherit; text-decoration: none; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
h1, h2, h3, h4, p { margin: 0; }
:focus-visible { outline: 2px solid var(--cyan); outline-offset: 2px; }
::-webkit-scrollbar { width: 8px; height: 8px; }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 8px; }

/* Layout */
.app { min-height: 100vh; background:
  radial-gradient(900px 500px at 85% -10%, rgba(109,40,217,.22), transparent 60%),
  radial-gradient(700px 400px at 10% 110%, rgba(37,99,235,.14), transparent 60%), var(--bg); }
.sidebar { position: fixed; inset: 0 auto 0 0; width: var(--sidebar-w); background: var(--bg2); border-right: 1px solid var(--border);
  display: flex; flex-direction: column; z-index: 60; transition: transform .25s ease; }
.main-col { margin-left: var(--sidebar-w); min-height: 100vh; display: flex; flex-direction: column; min-width: 0; }
.header { position: sticky; top: 0; z-index: 40; height: var(--header-h); display: flex; align-items: center; gap: 12px; padding: 0 28px;
  background: rgba(7,11,32,.82); backdrop-filter: blur(14px); border-bottom: 1px solid var(--border); }
.content { padding: 28px; flex: 1; min-width: 0; max-width: 1280px; width: 100%; margin: 0 auto; }
.scrim { display: none; }

/* Sidebar */
.brand { display: flex; align-items: center; gap: 12px; padding: 20px 20px 14px; }
.brand img { width: 40px; height: 40px; }
.brand-name { font-size: 22px; font-weight: 800; letter-spacing: -.3px; }
.brand-tag { font-size: 12px; color: var(--muted); }
.nav { flex: 1; overflow-y: auto; padding: 8px 12px; display: flex; flex-direction: column; gap: 2px; }
.nav-item { display: flex; align-items: center; gap: 12px; width: 100%; padding: 11px 12px; border-radius: 12px; border: 1px solid transparent;
  background: none; color: var(--muted); font-size: 14.5px; font-weight: 600; text-align: left; transition: background .15s, color .15s; }
.nav-item:hover { background: var(--card); color: var(--text); }
.nav-item.active { background: linear-gradient(90deg, rgba(168,85,247,.22), rgba(37,99,235,.12)); color: var(--text); border-color: rgba(168,85,247,.45); }
.nav-item .chev { margin-left: auto; transition: transform .2s; }
.nav-item.open .chev { transform: rotate(180deg); }
.sub { display: grid; grid-template-rows: 0fr; transition: grid-template-rows .25s ease; }
.sub.open { grid-template-rows: 1fr; }
.sub > div { overflow: hidden; margin-left: 22px; padding-left: 10px; border-left: 1px solid var(--border); }
.sub a { display: block; padding: 8px 12px; margin: 2px 0; border-radius: 10px; font-size: 13.5px; color: var(--muted); }
.sub a:hover { color: var(--text); background: var(--card); }
.sub a.active { color: var(--text); background: rgba(168,85,247,.18); font-weight: 600; }
.side-promos { padding: 12px; display: flex; flex-direction: column; gap: 10px; }
.pro-mini { background: var(--card2); border: 1px solid rgba(168,85,247,.4); border-radius: 14px; padding: 14px; }
.pro-mini h4 { display: flex; align-items: center; gap: 8px; font-size: 15px; }
.pro-mini p { color: var(--muted); font-size: 12.5px; margin: 6px 0 10px; }
.study-card { border-radius: 14px; padding: 14px; background: linear-gradient(135deg, #2a1065, #151D43); border: 1px solid var(--border); position: relative; overflow: hidden; }
.study-card strong { display: block; font-size: 14px; }
.study-card span { font-size: 12px; color: var(--muted); }
@media (max-height: 760px) { .study-card { display: none; } }

/* Buttons */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 10px 18px; border-radius: 12px; border: 1px solid var(--border);
  background: var(--card2); font-weight: 600; font-size: 14px; transition: transform .12s, border-color .15s, background .15s; min-height: 42px; }
.btn:hover { border-color: var(--purple); }
.btn:active { transform: scale(.98); }
.btn-primary { background: linear-gradient(135deg, var(--purple), var(--deep) 55%, var(--blue)); border-color: transparent; box-shadow: 0 8px 24px rgba(109,40,217,.35); }
.btn-primary:hover { border-color: transparent; filter: brightness(1.1); }
.btn-gold { background: linear-gradient(135deg, #FACC15, #F59E0B); color: #1b1303; border-color: transparent; }
.btn-sm { padding: 7px 12px; min-height: 36px; font-size: 13px; border-radius: 10px; }
.btn-block { width: 100%; }
.icon-btn { width: 42px; height: 42px; display: grid; place-items: center; border-radius: 12px; border: 1px solid var(--border); background: var(--card); position: relative; }
.icon-btn:hover { border-color: var(--purple); }
.menu-btn { display: none; }

/* Header search */
.search { position: relative; flex: 1; max-width: 560px; }
.search-box { display: flex; align-items: center; gap: 10px; background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 0 14px; height: 44px; }
.search-box:focus-within { border-color: var(--purple); box-shadow: 0 0 0 3px rgba(168,85,247,.2); }
.search-box input { flex: 1; min-width: 0; background: none; border: 0; outline: 0; }
.search-box input::placeholder { color: var(--muted); }
.kbd { font-size: 11px; color: var(--muted); border: 1px solid var(--border); border-radius: 6px; padding: 2px 6px; background: var(--bg2); }
.dropdown { position: absolute; top: calc(100% + 8px); left: 0; right: 0; background: var(--card); border: 1px solid var(--border); border-radius: 14px;
  box-shadow: 0 20px 50px rgba(0,0,0,.5); padding: 6px; z-index: 70; max-height: 70vh; overflow-y: auto; }
.result { display: flex; align-items: center; gap: 12px; padding: 10px; border-radius: 10px; width: 100%; background: none; border: 0; text-align: left; }
.result.sel, .result:hover { background: rgba(168,85,247,.18); }
.result .ri { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; background: var(--card2); color: var(--purple); flex: none; }
.result small { display: block; color: var(--muted); font-size: 12px; }
.empty { padding: 18px; text-align: center; color: var(--muted); font-size: 14px; }
.dot { position: absolute; top: 9px; right: 10px; width: 8px; height: 8px; border-radius: 50%; background: var(--orange); }
.pop { position: absolute; right: 0; top: calc(100% + 8px); width: 300px; max-width: 86vw; background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 14px; box-shadow: 0 20px 50px rgba(0,0,0,.5); z-index: 70; }
.pop h4 { margin-bottom: 8px; }
.pop p { color: var(--muted); font-size: 13.5px; padding: 8px 0; border-top: 1px solid var(--border); }

/* Cards & grids */
.card { background: linear-gradient(160deg, rgba(21,29,67,.9), rgba(17,23,53,.9)); border: 1px solid var(--border); border-radius: var(--radius); padding: 18px; }
.grid { display: grid; gap: 16px; }
.g5 { grid-template-columns: repeat(5, 1fr); }
.g4 { grid-template-columns: repeat(4, 1fr); }
.g3 { grid-template-columns: repeat(3, 1fr); }
.g2 { grid-template-columns: repeat(2, 1fr); }
.section { margin-top: 36px; }
.section-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 16px; }
.section-head h2 { font-size: 22px; letter-spacing: -.2px; }
.link { color: var(--purple); font-weight: 600; font-size: 14px; background: none; border: 0; padding: 0; }
.link:hover { text-decoration: underline; }
.gradient-text { background: linear-gradient(90deg, #C084FC, #A855F7 40%, #60A5FA); -webkit-background-clip: text; background-clip: text; color: transparent; }

/* Hero */
.hero { position: relative; overflow: hidden; border-radius: 24px; padding: 44px; display: grid; grid-template-columns: 1.15fr 1fr; gap: 24px; align-items: center;
  background: linear-gradient(120deg, #0f1a5c 0%, #3b1a8a 55%, #5b21b6 100%); border: 1px solid rgba(168,85,247,.45); box-shadow: 0 24px 70px rgba(109,40,217,.28); }
.hero::before { content: ""; position: absolute; inset: 0; background:
  repeating-linear-gradient(115deg, rgba(255,255,255,.04) 0 1px, transparent 1px 46px); pointer-events: none; }
.hero h1 { font-size: clamp(30px, 4.2vw, 50px); line-height: 1.1; letter-spacing: -1px; font-weight: 800; }
.hero p { color: #d6d3ff; margin: 16px 0 24px; max-width: 520px; font-size: 16.5px; }
.hero-actions { display: flex; flex-wrap: wrap; gap: 12px; }
.hero-art { position: relative; z-index: 1; display: grid; place-items: center; }
.hero-art svg { width: 100%; max-width: 380px; height: auto; }

/* Category cards */
.cat { border-radius: var(--radius); padding: 18px; display: flex; flex-direction: column; gap: 10px; min-height: 210px; border: 1px solid rgba(255,255,255,.14);
  transition: transform .18s, box-shadow .18s; text-align: left; color: #fff; }
.cat:hover { transform: translateY(-4px); box-shadow: 0 16px 36px rgba(0,0,0,.4); }
.cat .ci { width: 48px; height: 48px; border-radius: 14px; display: grid; place-items: center; background: rgba(255,255,255,.2); }
.cat h3 { font-size: 17px; }
.cat p { font-size: 13px; opacity: .9; flex: 1; }
.cat .go { display: inline-flex; align-items: center; justify-content: center; align-self: flex-start; padding: 7px 16px; border-radius: 10px; background: rgba(255,255,255,.22); font-weight: 600; font-size: 13px; }
.c-blue { background: linear-gradient(145deg, #2563EB, #1e3a8a); }
.c-green { background: linear-gradient(145deg, #10B981, #065f46); }
.c-orange { background: linear-gradient(145deg, #F59E0B, #b45309); }
.c-purple { background: linear-gradient(145deg, #A855F7, #5b21b6); }
.c-cyan { background: linear-gradient(145deg, #06B6D4, #155e75); }

/* Template cards */
.tpl { display: flex; flex-direction: column; gap: 10px; }
.tpl-ico { width: 44px; height: 44px; border-radius: 12px; display: grid; place-items: center; background: rgba(168,85,247,.16); color: var(--purple); }
.tpl h3 { font-size: 15.5px; }
.tpl .meta { font-size: 12.5px; color: var(--muted); }
.tpl .row { display: flex; gap: 8px; margin-top: auto; flex-wrap: wrap; }
.tpl .row .btn { flex: 1; }
.badge { display: inline-block; font-size: 11.5px; padding: 2px 9px; border-radius: 999px; border: 1px solid var(--border); color: var(--muted); }

.feature-row { display: grid; grid-template-columns: 3fr 1fr; gap: 16px; align-items: stretch; }
.promo { border-radius: var(--radius); padding: 22px; background: linear-gradient(160deg, #6D28D9, #2a1065); border: 1px solid rgba(250,204,21,.4); display: flex; flex-direction: column; gap: 10px; justify-content: center; }
.promo h3 { font-size: 20px; }
.promo p { color: #ddd6fe; font-size: 14px; }

.trust { display: grid; grid-template-columns: repeat(4, 1fr); border: 1px solid var(--border); border-radius: var(--radius); background: var(--card); }
.trust > div { display: flex; align-items: center; gap: 12px; padding: 18px; border-left: 1px solid var(--border); }
.trust > div:first-child { border-left: 0; }
.trust svg { color: var(--cyan); flex: none; }
.trust strong { display: block; font-size: 14.5px; }
.trust span { font-size: 12.5px; color: var(--muted); }

.steps .card { display: flex; gap: 14px; align-items: flex-start; }
.step-n { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; background: linear-gradient(135deg, var(--purple), var(--blue)); font-weight: 700; flex: none; }
.mini-list { display: grid; gap: 10px; }
.mini { display: flex; align-items: center; gap: 12px; padding: 12px; border-radius: 12px; background: var(--card); border: 1px solid var(--border); width: 100%; text-align: left; }
.mini:hover { border-color: var(--purple); }
.mini small { color: var(--muted); display: block; font-size: 12px; }

.footer { border-top: 1px solid var(--border); margin-top: 48px; padding: 32px 28px 24px; background: var(--bg2); }
.footer-grid { display: grid; grid-template-columns: 2fr 1fr 1fr 1fr; gap: 28px; max-width: 1224px; margin: 0 auto; }
.footer h4 { margin-bottom: 10px; font-size: 14px; }
.footer a { display: block; color: var(--muted); font-size: 13.5px; padding: 3px 0; }
.footer a:hover { color: var(--text); }
.copyright { text-align: center; color: var(--muted); font-size: 12.5px; margin-top: 24px; }

/* Page chrome */
.crumbs { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: 13px; color: var(--muted); margin-bottom: 14px; }
.crumbs a:hover { color: var(--text); }
.page-title { font-size: 30px; letter-spacing: -.5px; font-weight: 800; }
.page-sub { color: var(--muted); margin: 8px 0 22px; max-width: 680px; }
.filters { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 18px; align-items: center; }
.chip { padding: 8px 14px; border-radius: 999px; border: 1px solid var(--border); background: var(--card); font-size: 13.5px; font-weight: 600; color: var(--muted); }
.chip.on { background: rgba(168,85,247,.22); color: var(--text); border-color: var(--purple); }
.field { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 0 12px; height: 42px; outline: 0; min-width: 0; }
.field:focus { border-color: var(--purple); }
select.field option { background: var(--card); }
textarea.field { height: auto; padding: 10px 12px; resize: vertical; }
label.lbl { display: grid; gap: 6px; font-size: 13px; color: var(--muted); font-weight: 600; }
.workspace { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.notice { border: 1px dashed var(--purple); background: rgba(168,85,247,.08); border-radius: var(--radius); padding: 22px; text-align: center; color: var(--muted); }
.notice h3 { color: var(--text); margin-bottom: 6px; }
.paper { background: #fff; color: #111; border-radius: 6px; padding: 28px; min-height: 260px; font-family: Georgia, "Times New Roman", serif; }
.faq details { border: 1px solid var(--border); border-radius: 12px; background: var(--card); padding: 14px 16px; margin-bottom: 10px; }
.faq summary { font-weight: 600; cursor: pointer; }
.faq p { color: var(--muted); margin-top: 8px; font-size: 14.5px; }

/* Modal */
.modal-back { position: fixed; inset: 0; background: rgba(3,5,18,.75); backdrop-filter: blur(4px); z-index: 100; display: grid; place-items: center; padding: 16px; }
.modal { width: 100%; max-width: 640px; max-height: 90vh; overflow-y: auto; background: var(--card); border: 1px solid var(--purple); border-radius: 20px; padding: 24px; box-shadow: 0 30px 80px rgba(0,0,0,.6); }
.modal-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 14px; }
.modal-head h3 { font-size: 20px; }

.toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: var(--card2); border: 1px solid var(--green); padding: 12px 18px; border-radius: 12px; z-index: 120; }

/* Pricing */
.plan { display: flex; flex-direction: column; gap: 12px; }
.plan ul { list-style: none; padding: 0; margin: 0; display: grid; gap: 8px; color: var(--muted); font-size: 14px; }
.plan li::before { content: "✓ "; color: var(--green); font-weight: 700; }
.price { font-size: 30px; font-weight: 800; }

/* Responsive */
@media (max-width: 1180px) { .g5 { grid-template-columns: repeat(3, 1fr); } .g4 { grid-template-columns: repeat(2, 1fr); } .feature-row { grid-template-columns: 1fr; } }
@media (max-width: 900px) {
  .sidebar { transform: translateX(-100%); width: min(300px, 86vw); }
  .sidebar.open { transform: none; box-shadow: 20px 0 60px rgba(0,0,0,.6); }
  .scrim.show { display: block; position: fixed; inset: 0; background: rgba(3,5,18,.6); z-index: 55; }
  .main-col { margin-left: 0; }
  .menu-btn { display: grid; }
  .header { padding: 0 14px; gap: 8px; height: 60px; }
  .content { padding: 16px; }
  .kbd { display: none; }
  .hero { grid-template-columns: 1fr; padding: 26px 20px; }
  .hero-art { display: none; }
  .hero p { font-size: 15px; margin: 12px 0 18px; }
  .g3, .g2, .workspace { grid-template-columns: 1fr; }
  .g5 { grid-template-columns: repeat(2, 1fr); }
  .trust { grid-template-columns: 1fr 1fr; }
  .trust > div:nth-child(3) { border-left: 0; }
  .trust > div:nth-child(n+3) { border-top: 1px solid var(--border); }
  .footer-grid { grid-template-columns: 1fr 1fr; }
  .page-title { font-size: 25px; }
  .search-hide-mobile { display: none; }
}
@media (max-width: 520px) { .g5, .g4 { grid-template-columns: 1fr; } .cat { min-height: 0; } .hero-actions .btn { flex: 1; } }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

/* ---------- Shared tool UI ---------- */
.spin { animation: spin 1s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.print-only { display: none; }
.drop { display: grid; justify-items: center; gap: 6px; text-align: center; padding: 32px 16px; border: 2px dashed var(--border); border-radius: var(--radius);
  background: rgba(21,29,67,.5); color: var(--muted); cursor: pointer; transition: border-color .15s, background .15s; }
.drop strong { color: var(--text); }
.drop:hover, .drop.over { border-color: var(--purple); background: rgba(168,85,247,.12); }
.drop svg { color: var(--purple); }
.alert { margin-top: 12px; padding: 10px 14px; border-radius: 12px; font-size: 14px; border: 1px solid; display: flex; gap: 8px; align-items: center; }
.alert.ok { background: rgba(16,185,129,.1); border-color: rgba(16,185,129,.4); color: #a7f3d0; }
.alert.err { background: rgba(244,63,94,.1); border-color: rgba(244,63,94,.45); color: #fecdd3; }
.actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 16px; align-items: center; }
.form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 12px; }
.icon-btn.sm { width: 32px; height: 32px; border-radius: 9px; flex: none; }
.icon-btn:disabled, .btn:disabled { opacity: .45; cursor: not-allowed; }
input[type=range] { width: 100%; accent-color: var(--purple); }
input[type=checkbox] { accent-color: var(--purple); width: 18px; height: 18px; flex: none; }
.thumbs { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 12px; }
.thumbs.big { grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); }
.thumb-card { background: var(--bg2); border: 1px solid var(--border); border-radius: 12px; padding: 8px; display: grid; gap: 4px; align-content: start; }
.thumb-card.sel { border-color: #f43f5e; background: rgba(244,63,94,.12); }
.thumb-card img { width: 100%; height: 110px; object-fit: contain; background: #fff; border-radius: 6px; }
.thumb-card .pg { height: 150px; background: #fff; border-radius: 6px; display: grid; place-items: center; overflow: hidden; color: #888; }
.thumb-card .pg img { width: auto; height: auto; max-height: 100%; max-width: 100%; background: none; }
.thumbs.big .thumb-card[draggable=true] { cursor: grab; }
.tc-name { font-size: 12px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tc-size { font-size: 11.5px; color: var(--muted); }
.tc-row { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.pri-high { color: #fda4af; border-color: #f43f5e; } .pri-medium { color: #fde68a; border-color: #f59e0b; } .pri-low { color: #a7f3d0; border-color: #10b981; }
.mini.done-row { opacity: .6; }
.pdf-stage { position: relative; width: 100%; max-width: 640px; margin: 0 auto; background: #fff; border-radius: 6px; overflow: hidden; touch-action: none; user-select: none; }
.pdf-stage img { width: 100%; height: 100%; display: block; }
.pdf-text { position: absolute; white-space: pre; line-height: 1.2; cursor: move; padding: 0 1px; touch-action: none; font-family: Helvetica, Arial, sans-serif; }
.pdf-text.on { outline: 2px dashed #7c3aed; outline-offset: 2px; }

/* Timetable grid */
.tt-scroll { overflow-x: auto; }
.tt { display: grid; grid-template-columns: 52px repeat(7, minmax(92px, 1fr)); min-width: 780px; }
.tt-corner, .tt-day { background: var(--bg2); padding: 8px 4px; text-align: center; font-size: 13px; font-weight: 700; border-bottom: 1px solid var(--border); }
.tt-hours { font-size: 11px; color: var(--muted); }
.tt-hours div { text-align: right; padding-right: 6px; border-top: 1px solid var(--border); }
.tt-col { position: relative; border-left: 1px solid var(--border); }
.tt-line { border-top: 1px solid var(--border); }
.tt-entry { position: absolute; left: 2px; right: 2px; border: 1px solid; border-radius: 8px; padding: 3px 6px; font-size: 11.5px; overflow: hidden; cursor: pointer; color: #fff; line-height: 1.25; }
.tt-entry strong { display: block; } .tt-entry span { display: block; opacity: .9; }
.week-grid { display: grid; grid-template-columns: repeat(7, minmax(130px, 1fr)); gap: 8px; overflow-x: auto; }
.week-col { background: var(--bg2); border: 1px solid var(--border); border-radius: 12px; padding: 8px; display: grid; gap: 6px; align-content: start; min-height: 120px; min-width: 130px; }
.week-head { display: flex; justify-content: space-between; align-items: baseline; } .week-head small { color: var(--muted); }

const todayStr = () => new Date().toLocaleDateString('en-GB', { day: 'numeric', month: 'long', year: 'numeric' });

// Build the starting document for a template id ('blank' for the blank option)
function makeDoc(slug, tid) {
  const fam = FAMILIES[slug];
  const blank = tid === 'blank';
  const tpl = blank ? null : fam.templates.find((t) => t.id === tid) || fam.templates[0];
  const fields = {};
  fam.fields.forEach((fd) => { fields[fd.k] = blank ? '' : fd.k === 'date' ? todayStr() : fd.v; });
  let secs = [];
  if (!blank) {
    const keep = tpl.keep === 'all' ? fam.sections.map((_, i) => i) : tpl.keep;
    secs = keep.map((i) => ({ ...fam.sections[i] }));
    if (tpl.extra) tpl.extra.forEach((x, n) => secs.splice(tpl.extraAt[n], 0, { ...x }));
  }
  return { tid: blank ? 'blank' : tpl.id, fields, sections: secs.map((x, i) => ({ id: 's' + i + Math.random().toString(36).slice(2, 6), h: x.h, b: x.b })) };
}

function styleFor(slug, tid) {
  const fam = FAMILIES[slug];
  const tpl = fam.templates.find((t) => t.id === tid);
  return { ...(tpl ? STYLES[tpl.style] : BLANK_STYLE), theme: tpl?.theme };
}

let toastT;

  let t = $('#toast'); if (!t) { t = document.createElement('div'); t.id = 'toast'; t.className = 'toast'; document.body.appendChild(t); }
  t.textContent = msg; t.style.display = 'block'; clearTimeout(toastT); toastT = setTimeout(() => { t.style.display = 'none'; }, 2600);
}
function modal(title, html, wide) {
  closeModal();

  m.innerHTML = `<div class="modal${wide ? ' wide' : ''}"><div class="modal-head"><h3>${esc(title)}</h3><button class="icon-btn" data-act="closeModal" aria-label="Close">✕</button></div>${html}</div>`;
  m.addEventListener('mousedown', (e) => { if (e.target === m) closeModal(); });

}

/* ---------- fit (scale A4 papers to container) ---------- */
function fit(html, scale) {
  const st = scale ? `width:${794 * scale}px;margin:0 auto;` : '';
  return `<div class="fit-wrap" data-scale="${scale || ''}" style="${st}"><div class="fit-inner" style="width:794px;transform-origin:top left">${html}</div></div>`;
}
function applyFit() {
  $$('.fit-wrap').forEach((w) => {
    const i = w.firstElementChild; if (!i) return;
    const sc = parseFloat(w.dataset.scale) || Math.min(1, w.clientWidth / 794);
    i.style.transform = `scale(${sc})`; w.style.height = (i.offsetHeight * sc) + 'px';
  });
}

let expanded = null;
function syncNav(path) {
  $$('[data-nav]').forEach((a) => a.classList.toggle('active', a.dataset.nav === path));
  const t = tools.find((x) => toolPath(x) === path); const c = categories.find((x) => x.path === path);
  const id = t ? t.cat : c ? c.id : null; if (id) expanded = id;
  categories.forEach((x) => { $('#sub-' + x.id).classList.toggle('open', expanded === x.id); const b = $(`[data-cat="${x.id}"]`); b.classList.toggle('open', expanded === x.id); b.classList.toggle('active', id === x.id); });
  $('#sb').classList.remove('open'); $('#sc').classList.remove('show');
}

/* ---------- search ---------- */
let sel = 0, results = [];
function drawSearch() {
  const dd = $('#dd'), q = $('#q').value;
  if (!q.trim()) { dd.style.display = 'none'; return; }
  results = searchAll(q); dd.style.display = 'block';
  dd.innerHTML = results.length ? results.map((r, i) => `<button class="result${i === sel ? ' sel' : ''}" data-act="pick" data-i="${i}"><span class="ri">${ico(r.icon)}</span><span><strong>${esc(r.title)}</strong><small>${esc(r.label)}</small></span></button>`).join('')
    : `<div class="empty">No match for “${esc(q)}”. Try “PDF”, “CV” or “timetable”.</div>`;
}
function pick(i) { const r = results[i]; if (!r) return; go(r.path); $('#q').value = ''; $('#dd').style.display = 'none'; $('#q').blur(); }

/* ---------- events ---------- */
const A = {};
document.addEventListener('click', (e) => {
  const act = e.target.closest('[data-act]');
  if (act && A[act.dataset.act]) { A[act.dataset.act](act, e); return; }
  const g = e.target.closest('[data-go]'); if (g) { e.preventDefault(); go(g.dataset.go); }
  if (!e.target.closest('.search')) { const d = $('#dd'); if (d) d.style.display = 'none'; }
  if (!e.target.closest('#bell') && !e.target.closest('[data-act=bell]')) { const b = $('#bell'); if (b) b.style.display = 'none'; }
});
Object.assign(A, {
  closeModal, menu() { $('#sb').classList.toggle('open'); $('#sc').classList.toggle('show'); },

  pick(el) { pick(Number(el.dataset.i)); },
});
document.addEventListener('keydown', (e) => {
  const q = $('#q'); if (!q) return;
  const typing = /INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName) || document.activeElement.isContentEditable;
  if ((e.key === 'k' && (e.ctrlKey || e.metaKey)) || (e.key === '/' && !typing)) { e.preventDefault(); q.focus(); }
  if (e.key === 'Escape') { closeModal(); $('#dd').style.display = 'none'; }
  if (document.activeElement === q) {
    if (e.key === 'ArrowDown') { e.preventDefault(); sel = Math.min(sel + 1, results.length - 1); drawSearch(); }
    if (e.key === 'ArrowUp') { e.preventDefault(); sel = Math.max(sel - 1, 0); drawSearch(); }
    if (e.key === 'Enter') pick(sel);
  }
});
document.addEventListener('input', (e) => { if (e.target.id === 'q') { sel = 0; drawSearch(); } });
window.addEventListener('resize', applyFit);

  window.__catGrid = grid;
  return `${crumbs([{ label: cat.title }])}<h1 class="page-title">${cat.title}</h1><p class="page-sub">${cat.intro}</p><div class="filters"><div class="search-box" style="max-width:360px;flex:1">🔍<input id="catq" placeholder="Search ${cat.title.toLowerCase()}…"></div></div><div id="catgrid">${grid('')}</div>`;

const LIB = { filter: 'all', q: '', sort: 'featured' };
function libGrid() {
  let l = tools.filter((t) => t.template || t.cat === 'pdf'); const s = LIB.q.toLowerCase();
  if (LIB.filter !== 'all') l = l.filter((t) => t.cat === LIB.filter);
  if (s) l = l.filter((t) => `${t.title} ${t.desc} ${t.keywords}`.toLowerCase().includes(s));
  const flag = (k) => (a, b) => (b[k] ? 1 : 0) - (a[k] ? 1 : 0);
  if (LIB.sort === 'az') l = [...l].sort((a, b) => a.title.localeCompare(b.title)); else l = [...l].sort(flag(LIB.sort));
  return l.length ? `<div class="grid" style="grid-template-columns:repeat(auto-fill,minmax(230px,1fr))">${l.map(tplCard).join('')}</div>` : '<div class="notice"><h3>No templates found</h3>Try another filter or clear the search.</div>';

let cur = null;
function pageTool(slug, q) {
  const t = toolBySlug(slug); if (!t) return pageHome();
  const cat = catById(t.cat);
  const key = slug + '|' + (q.t || '') + '|' + (q.d || '');
  const fresh = !cur || cur.key !== key; if (fresh) cur = { key };
  let body;
  if (FAMILIES[slug]) body = docTool(slug, q, fresh);
  else if (slug === 'cv-builder') body = cvTool(q, fresh);
  else if (/-editor$|^blank-document$/.test(slug)) body = richTool(slug, q, fresh);
  else body = otherTool(slug);
  return `<div class="no-print">${crumbs([{ label: cat.title, to: cat.path }, { label: t.title }])}<div style="display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:20px"><span class="tpl-ico" style="width:52px;height:52px;font-size:24px">${ico(t.icon)}</span><div><h1 class="page-title">${t.title}</h1><p style="color:var(--muted)">${t.desc}</p></div></div></div>

  <div class="section"><div class="section-head"><h2>Related tools</h2></div><div class="grid g4">${toolsIn(t.cat).filter((x) => x.slug !== slug).slice(0, 4).map(miniTool).join('')}</div></div></div>`;
}
function render() {
  const { path, q } = parseRoute(); let html;
  const cat = categories.find((c) => c.path === path);
